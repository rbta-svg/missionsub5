name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bake plan into index.html
        run: python3 build.py

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/plan.json _site/data/

      # Requires Pages to be enabled first:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The `enablement: true` option cannot do this for us — it needs a PAT,
      # not the default GITHUB_TOKEN.
      - uses: actions/configure-pages@v5

      # These three still run on Node 20, which GitHub removes from runners on
      # 16 September 2026 — the day before the race. Check for newer major
      # versions in early September and bump them.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
