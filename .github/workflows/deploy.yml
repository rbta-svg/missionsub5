name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plan.json
        run: python3 -c "import json;d=json.load(open('data/plan.json'));print(f\"{len(d['days'])} days, {sum(len(x['sessions']) for x in d['days'])} sessions\")"

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/plan.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
