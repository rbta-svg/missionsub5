<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiara — Cervia 70.3</title>
<style>
  :root {
    --bg: #f7f7f5;
    --bg-elevated: #ffffff;
    --bg-hero: #ffffff;
    --text: #1c1c1a;
    --text-muted: #6b6b66;
    --border: #e0e0da;
    --accent: #1c1c1a;

    --today-bg: #eef5ff;
    --today-border: #2a78d6;

    --past-opacity: 0.45;

    --badge-a-bg: #1c1c1a;
    --badge-a-text: #ffffff;
    --badge-b-bg: #d8d8d2;
    --badge-b-text: #2a2a26;
    --badge-c-bg: transparent;
    --badge-c-text: #6b6b66;
    --badge-c-border: #b8b8b0;

    --error-bg: #fdecec;
    --error-text: #8a2020;
    --error-border: #e0a0a0;

    --sport-swim: #2a78d6;
    --sport-bike: #eb6834;
    --sport-run: #1baf7a;
    --sport-brick: #9b59b6;
    --sport-strength: #eda100;
    --sport-rest: #8a8a85;
    --sport-race: #e34948;

    --table-stripe: #f1f1ed;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --bg-elevated: #211f22;
      --bg-hero: #211f22;
      --text: #ececec;
      --text-muted: #a0a0a0;
      --border: #3a3a3e;
      --accent: #ececec;

      --today-bg: #1c2a3a;
      --today-border: #4c96ea;

      --badge-a-bg: #ececec;
      --badge-a-text: #17171a;
      --badge-b-bg: #3a3a3e;
      --badge-b-text: #d6d6d6;
      --badge-c-bg: transparent;
      --badge-c-text: #9a9a9a;
      --badge-c-border: #55555a;

      --error-bg: #3a1f1f;
      --error-text: #f0a0a0;
      --error-border: #6a3232;

      --table-stripe: #1f1e21;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 16px 64px;
  }

  a { color: inherit; }

  /* ---------- Header ---------- */
  header.top {
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  header.top h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header.top .race-meta {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 14px;
  }

  .countdown-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .stat-chip {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    min-width: 90px;
  }

  .stat-chip .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .stat-chip .value {
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Error banner ---------- */
  .error-banner {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid var(--error-border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 0.92rem;
  }

  /* ---------- Section headings ---------- */
  h2.section-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 0 0 10px;
    font-weight: 700;
  }

  section { margin-bottom: 34px; }

  /* ---------- Hero: today ---------- */
  .hero-box {
    background: var(--bg-hero);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }

  .hero-heading {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }

  .hero-heading .hero-date {
    font-size: 1.2rem;
    font-weight: 700;
  }

  .hero-block {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .hero-note {
    margin-top: 10px;
    font-size: 0.88rem;
    color: var(--text-muted);
    background: var(--table-stripe);
    border-radius: 8px;
    padding: 8px 12px;
  }

  .hero-message {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin: 8px 0 14px;
  }

  .rest-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    background: var(--table-stripe);
    border-radius: 10px;
    font-size: 1rem;
  }

  /* ---------- Session cards ---------- */
  .session-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-left: 4px solid var(--card-color, var(--sport-rest));
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 12px;
  }

  .session-top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }

  .sport-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 700;
  }

  .session-title {
    font-weight: 700;
    font-size: 1rem;
    flex: 1 1 auto;
    min-width: 140px;
  }

  .session-duration {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .session-detail {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .session-sets {
    margin: 8px 0 0;
    padding-left: 20px;
    font-size: 0.86rem;
  }

  .session-sets li { margin-bottom: 3px; }

  /* ---------- Priority badge ---------- */
  .badge {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    line-height: 1.5;
  }
  .badge-A { background: var(--badge-a-bg); color: var(--badge-a-text); }
  .badge-B { background: var(--badge-b-bg); color: var(--badge-b-text); }
  .badge-C {
    background: var(--badge-c-bg);
    color: var(--badge-c-text);
    border: 1px solid var(--badge-c-border);
  }

  /* ---------- Calendar ---------- */
  .block-group { margin-bottom: 22px; }

  .block-heading {
    font-size: 0.95rem;
    font-weight: 700;
    margin: 18px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .block-heading:first-child { margin-top: 0; }

  .day-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 10px;
    border-radius: 8px;
    border-left: 3px solid transparent;
    cursor: pointer;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    margin-bottom: 6px;
  }

  .day-row.is-past { opacity: var(--past-opacity); }

  .day-row.is-today {
    border-left: 3px solid var(--today-border);
    background: var(--today-bg);
  }

  .day-row .day-left {
    width: 78px;
    flex: 0 0 78px;
  }

  .day-row .weekday {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }

  .day-row .daynum {
    font-size: 0.95rem;
    font-weight: 700;
  }

  .day-row .day-right {
    flex: 1 1 auto;
    min-width: 0;
  }

  .day-session-line {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 3px 0;
    flex-wrap: wrap;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: 0 0 9px;
    background: var(--dot-color, var(--sport-rest));
  }

  .day-session-title {
    font-size: 0.88rem;
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  .day-session-meta {
    font-size: 0.76rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .day-detail {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }

  .day-row.expanded .day-detail { display: block; }

  .day-detail .session-detail-block {
    margin-bottom: 10px;
  }
  .day-detail .session-detail-block:last-child { margin-bottom: 0; }

  .day-note-inline {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .toggle-hint {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-left: auto;
    flex: 0 0 auto;
    align-self: center;
  }

  /* ---------- Race plan table ---------- */
  table.splits {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  table.splits th, table.splits td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  table.splits th {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  table.splits tbody tr:nth-child(odd) { background: var(--table-stripe); }

  /* ---------- Legend ---------- */
  .legend {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.86rem;
  }

  .legend-row .badge { flex: 0 0 auto; width: 22px; text-align: center; }

  footer.foot {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.75rem;
    margin-top: 30px;
  }

  @media (max-width: 480px) {
    header.top h1 { font-size: 1.25rem; }
    .day-row .day-left { width: 58px; flex-basis: 58px; }
    .stat-chip { min-width: 78px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Chiara — Cervia 70.3</h1>
    <div class="race-meta" id="raceMeta">Loading race details…</div>
    <div class="countdown-row" id="countdownRow"></div>
  </header>

  <div id="errorBanner"></div>

  <section id="heroSection">
    <h2 class="section-title">Today's training</h2>
    <div class="hero-box" id="heroBox">
      <div class="hero-message">Loading plan…</div>
    </div>
  </section>

  <section id="calendarSection">
    <h2 class="section-title">Calendar</h2>
    <div id="calendarBox"></div>
  </section>

  <section id="raceSection">
    <h2 class="section-title">Race plan</h2>
    <div id="raceBox"></div>
  </section>

  <section id="legendSection">
    <h2 class="section-title">Priority legend</h2>
    <div class="legend" id="legendBox"></div>
  </section>

  <footer class="foot">Built for Chiara · data from ./data/plan.json</footer>
</div>

<script>
(function () {
  "use strict";

  var SPORT_LABELS = {
    swim: "Swim",
    bike: "Bike",
    run: "Run",
    brick: "Brick",
    strength: "Strength",
    rest: "Rest",
    race: "Race"
  };

  var SPORT_ICON = {
    swim: "🏊",
    bike: "🚴",
    run: "🏃",
    brick: "🔁",
    strength: "🏋",
    rest: "🛌",
    race: "🏁"
  };

  var WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function parseLocalDate(dateStr) {
    var parts = dateStr.split("-");
    var y = Number(parts[0]);
    var m = Number(parts[1]);
    var d = Number(parts[2]);
    return new Date(y, m - 1, d);
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function todayStr() {
    var t = new Date();
    return t.getFullYear() + "-" + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate());
  }

  function daysBetween(fromDate, toDate) {
    var MS = 24 * 60 * 60 * 1000;
    var a = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
    var b = new Date(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());
    return Math.round((b - a) / MS);
  }

  function fmtDateLong(dateStr) {
    var d = parseLocalDate(dateStr);
    var weekday = WEEKDAYS[d.getDay()];
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return weekday + " " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  }

  function el(tag, opts) {
    var e = document.createElement(tag);
    opts = opts || {};
    if (opts.className) e.className = opts.className;
    if (opts.text !== undefined) e.textContent = opts.text;
    if (opts.html !== undefined) e.innerHTML = opts.html;
    if (opts.attrs) {
      for (var k in opts.attrs) {
        e.setAttribute(k, opts.attrs[k]);
      }
    }
    if (opts.style) {
      for (var s in opts.style) {
        e.style[s] = opts.style[s];
      }
    }
    return e;
  }

  function sportVar(sport) {
    return "var(--sport-" + (SPORT_LABELS[sport] ? sport : "rest") + ")";
  }

  function badgeEl(priority) {
    var b = el("span", { className: "badge badge-" + priority, text: priority });
    return b;
  }

  // ---------- Build a full session card (used in hero) ----------
  function buildSessionCard(session) {
    var card = el("div", { className: "session-card" });
    card.style.setProperty("--card-color", sportVar(session.sport));

    var top = el("div", { className: "session-top" });
    var icon = SPORT_ICON[session.sport] || "";
    var sportLabel = el("span", { className: "sport-label", text: (icon ? icon + " " : "") + (SPORT_LABELS[session.sport] || session.sport) });
    var title = el("div", { className: "session-title", text: session.title || "" });
    top.appendChild(sportLabel);
    top.appendChild(title);
    if (session.priority) top.appendChild(badgeEl(session.priority));
    if (session.duration) top.appendChild(el("span", { className: "session-duration", text: session.duration }));
    card.appendChild(top);

    if (session.detail) {
      card.appendChild(el("div", { className: "session-detail", text: session.detail }));
    }

    if (session.sets && session.sets.length) {
      var ul = el("ul", { className: "session-sets" });
      session.sets.forEach(function (line) {
        ul.appendChild(el("li", { text: line }));
      });
      card.appendChild(ul);
    }

    return card;
  }

  // ---------- Compact session line (used in calendar row) ----------
  function buildSessionLine(session) {
    var line = el("div", { className: "day-session-line" });
    var dot = el("span", { className: "dot" });
    dot.style.setProperty("--dot-color", sportVar(session.sport));
    line.appendChild(dot);
    line.appendChild(el("span", { className: "day-session-title", text: session.title || "" }));
    if (session.priority) line.appendChild(badgeEl(session.priority));
    var metaBits = [SPORT_LABELS[session.sport] || session.sport];
    if (session.duration) metaBits.push(session.duration);
    line.appendChild(el("span", { className: "day-session-meta", text: metaBits.join(" · ") }));
    return line;
  }

  function buildSplitsTable(splits) {
    var table = el("table", { className: "splits" });
    var thead = el("thead");
    var headRow = el("tr");
    ["Leg", "Time", "Note"].forEach(function (h) {
      headRow.appendChild(el("th", { text: h }));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = el("tbody");
    splits.forEach(function (s) {
      var row = el("tr");
      row.appendChild(el("td", { text: s.leg || "" }));
      row.appendChild(el("td", { text: s.time || "" }));
      row.appendChild(el("td", { text: s.note || "" }));
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    return table;
  }

  // ---------- Render header / countdown ----------
  function renderHeader(plan) {
    var race = plan.race;
    document.getElementById("raceMeta").textContent =
      race.name + " — " + race.location + " — " + fmtDateLong(race.date);

    var raceDate = parseLocalDate(race.date);
    var today = new Date();
    var diff = daysBetween(today, raceDate);

    var row = document.getElementById("countdownRow");
    row.innerHTML = "";

    var countdownLabel, countdownValue;
    if (diff > 0) {
      countdownLabel = "Days to race";
      countdownValue = String(diff);
    } else if (diff === 0) {
      countdownLabel = "Today";
      countdownValue = "Race day";
    } else {
      countdownLabel = "Race was";
      countdownValue = Math.abs(diff) + "d ago";
    }

    var chips = [
      [countdownLabel, countdownValue],
      ["Target", race.target],
      ["PB (" + race.pb_year + ")", race.pb]
    ];

    chips.forEach(function (c) {
      var chip = el("div", { className: "stat-chip" });
      chip.appendChild(el("div", { className: "label", text: c[0] }));
      chip.appendChild(el("div", { className: "value", text: c[1] }));
      row.appendChild(chip);
    });
  }

  // ---------- Render hero (today's training) ----------
  function renderHero(plan) {
    var box = document.getElementById("heroBox");
    box.innerHTML = "";

    var tStr = todayStr();
    var days = plan.days;
    var match = null;
    for (var i = 0; i < days.length; i++) {
      if (days[i].date === tStr) { match = days[i]; break; }
    }

    if (match && match.date === plan.race.date) {
      // Race day: show splits instead of sessions
      var heading = el("div", { className: "hero-heading" });
      heading.appendChild(el("div", { className: "hero-date", text: "🏁 It's race day!" }));
      heading.appendChild(el("div", { className: "hero-block", text: fmtDateLong(match.date) }));
      box.appendChild(heading);
      box.appendChild(el("div", { className: "hero-message", text: "Good luck, Chiara. Here is the plan." }));
      box.appendChild(buildSplitsTable(plan.race.splits));
      return;
    }

    if (match) {
      var isRestOnly = match.sessions.length > 0 && match.sessions.every(function (s) { return s.sport === "rest"; });

      var h = el("div", { className: "hero-heading" });
      h.appendChild(el("div", { className: "hero-date", text: fmtDateLong(match.date) }));
      h.appendChild(el("div", { className: "hero-block", text: match.block }));
      box.appendChild(h);

      if (isRestOnly) {
        var restBanner = el("div", { className: "rest-banner" });
        restBanner.appendChild(el("span", { text: "🛌" }));
        restBanner.appendChild(el("span", { text: "Rest day. Recover well — nothing to do today." }));
        box.appendChild(restBanner);
      } else {
        match.sessions.forEach(function (session) {
          box.appendChild(buildSessionCard(session));
        });
      }

      if (match.note) {
        box.appendChild(el("div", { className: "hero-note", text: "Note: " + match.note }));
      }
      return;
    }

    // No entry for today — find the next upcoming day
    var next = null;
    for (var j = 0; j < days.length; j++) {
      if (days[j].date > tStr) { next = days[j]; break; }
    }

    if (next) {
      var msg = (tStr < days[0].date)
        ? "The plan hasn't started yet. Here is the first day:"
        : "Nothing scheduled for today. Here is the next session:";
      box.appendChild(el("div", { className: "hero-message", text: msg }));

      var h2 = el("div", { className: "hero-heading" });
      h2.appendChild(el("div", { className: "hero-date", text: fmtDateLong(next.date) }));
      h2.appendChild(el("div", { className: "hero-block", text: next.block }));
      box.appendChild(h2);

      var nextIsRest = next.sessions.length > 0 && next.sessions.every(function (s) { return s.sport === "rest"; });
      if (nextIsRest) {
        var rb = el("div", { className: "rest-banner" });
        rb.appendChild(el("span", { text: "🛌" }));
        rb.appendChild(el("span", { text: "Rest day." }));
        box.appendChild(rb);
      } else {
        next.sessions.forEach(function (session) {
          box.appendChild(buildSessionCard(session));
        });
      }
      if (next.note) {
        box.appendChild(el("div", { className: "hero-note", text: "Note: " + next.note }));
      }
    } else {
      box.appendChild(el("div", { className: "hero-message", text: "The race is behind you now. Hope it went brilliantly!" }));
    }
  }

  // ---------- Render calendar ----------
  function renderCalendar(plan) {
    var box = document.getElementById("calendarBox");
    box.innerHTML = "";
    var tStr = todayStr();

    var currentBlock = null;
    var groupEl = null;

    plan.days.forEach(function (day, idx) {
      if (day.block !== currentBlock) {
        currentBlock = day.block;
        groupEl = el("div", { className: "block-group" });
        groupEl.appendChild(el("div", { className: "block-heading", text: currentBlock }));
        box.appendChild(groupEl);
      }

      var isPast = day.date < tStr;
      var isToday = day.date === tStr;

      var rowClass = "day-row";
      if (isPast) rowClass += " is-past";
      if (isToday) rowClass += " is-today";

      var row = el("div", { className: rowClass, attrs: { "data-idx": String(idx), tabindex: "0", role: "button", "aria-expanded": "false" } });

      var d = parseLocalDate(day.date);
      var left = el("div", { className: "day-left" });
      left.appendChild(el("div", { className: "weekday", text: WEEKDAYS[d.getDay()] }));
      left.appendChild(el("div", { className: "daynum", text: d.getDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()] }));
      row.appendChild(left);

      var right = el("div", { className: "day-right" });
      day.sessions.forEach(function (session) {
        right.appendChild(buildSessionLine(session));
      });

      // Expandable detail panel
      var detail = el("div", { className: "day-detail" });
      var hasDetail = day.sessions.some(function (s) { return s.detail || (s.sets && s.sets.length); }) || !!day.note;

      day.sessions.forEach(function (session) {
        if (session.detail || (session.sets && session.sets.length)) {
          var blockDiv = el("div", { className: "session-detail-block" });
          blockDiv.appendChild(el("div", { className: "session-title", text: session.title }));
          if (session.detail) {
            blockDiv.appendChild(el("div", { className: "session-detail", text: session.detail }));
          }
          if (session.sets && session.sets.length) {
            var ul = el("ul", { className: "session-sets" });
            session.sets.forEach(function (line) { ul.appendChild(el("li", { text: line })); });
            blockDiv.appendChild(ul);
          }
          detail.appendChild(blockDiv);
        }
      });
      if (day.note) {
        detail.appendChild(el("div", { className: "day-note-inline", text: "Note: " + day.note }));
      }
      right.appendChild(detail);

      row.appendChild(right);

      if (hasDetail) {
        row.addEventListener("click", function () {
          var expanded = row.classList.toggle("expanded");
          row.setAttribute("aria-expanded", expanded ? "true" : "false");
        });
        row.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            row.click();
          }
        });
        row.style.cursor = "pointer";
      } else {
        row.style.cursor = "default";
      }

      groupEl.appendChild(row);
    });
  }

  // ---------- Render race plan table ----------
  function renderRacePlan(plan) {
    var box = document.getElementById("raceBox");
    box.innerHTML = "";
    box.appendChild(buildSplitsTable(plan.race.splits));
  }

  // ---------- Render legend ----------
  function renderLegend(plan) {
    var box = document.getElementById("legendBox");
    box.innerHTML = "";
    ["A", "B", "C"].forEach(function (p) {
      var row = el("div", { className: "legend-row" });
      row.appendChild(badgeEl(p));
      row.appendChild(el("span", { text: plan.priorities[p] || "" }));
      box.appendChild(row);
    });
  }

  function showError(message) {
    var banner = document.getElementById("errorBanner");
    banner.innerHTML = "";
    banner.appendChild(el("div", { className: "error-banner", text: message }));
    document.getElementById("heroBox").innerHTML = "";
    document.getElementById("heroBox").appendChild(
      el("div", { className: "hero-message", text: "Unable to load today's training." })
    );
  }

  function draw(plan) {
    renderHeader(plan);
    renderHero(plan);
    renderCalendar(plan);
    renderRacePlan(plan);
    renderLegend(plan);
  }

  function embeddedPlan() {
    var node = document.getElementById("plan-data");
    if (!node) { return null; }
    try {
      var parsed = JSON.parse(node.textContent);
      return (parsed && parsed.days && parsed.days.length) ? parsed : null;
    } catch (e) {
      return null;
    }
  }

  function init() {
    var baked = embeddedPlan();

    // Draw immediately from the embedded copy so the page works from file://
    if (baked) { draw(baked); }

    // When served over http(s), prefer the live file so edits to
    // data/plan.json appear without rebuilding the page.
    if (location.protocol === "http:" || location.protocol === "https:") {
      fetch("./data/plan.json")
        .then(function (resp) {
          if (!resp.ok) { throw new Error("status " + resp.status); }
          return resp.json();
        })
        .then(function (plan) {
          if (plan && plan.days && plan.days.length) { draw(plan); }
        })
        .catch(function () {
          if (!baked) {
            showError("Couldn't load the training plan. Check that data/plan.json is present.");
          }
        });
    } else if (!baked) {
      showError("Couldn't load the training plan — no embedded copy found. Run: python3 build.py");
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
